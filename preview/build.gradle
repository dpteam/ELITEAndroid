plugins {
    id 'com.android.application'
}

android {
    namespace 'elite.preview'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        // Deliberately separate from elite.app: this is a graphics test, not the game.
        applicationId 'elite.preview'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '0.1-mesh-preview'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DELITE_BUILD_TESTS=OFF', '-DELITE_BUILD_PREVIEW=ON' }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}
